<!--
  Paste this into a Squarespace Code Block on the page where the canal map
  should live. The src below points at the live map. If the map ever moves to a new
  address, change it. The script makes the iframe grow and shrink to match the map's
  actual height, so there's no double scrollbar and no wasted white space.
-->
<div id="canal-map-embed-wrap" style="width:100%;">
  <iframe
    id="canal-map-iframe"
    src="https://jami-kolev.github.io/cape-coral-canal-map/"
    style="width:100%; border:0; display:block;"
    height="700"
    loading="lazy"
    title="Cape Coral Canal and Gulf Access Map"
  ></iframe>
</div>
<script>
  (function () {
    window.addEventListener('message', function (event) {
      if (!event.data || event.data.type !== 'canal-map-resize') return;
      var iframe = document.getElementById('canal-map-iframe');
      if (iframe) iframe.style.height = event.data.height + 'px';
    });
  })();
</script>
